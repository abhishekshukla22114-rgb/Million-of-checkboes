version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: postgres_checkboxes
    restart: unless-stopped
    environment:
      POSTGRES_DB: checkboxes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - checkbox_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d checkboxes"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Valkey (Redis-compatible in-memory store)
  valkey:
    image: valkey/valkey:latest
    container_name: valkey_checkboxes
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1", "--requirepass", "${REDIS_PASSWORD:-redis}"]
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    networks:
      - checkbox_net
    healthcheck:
      test: ["CMD", "valkey-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Backend Server
  app:
    build: .
    container_name: node_checkboxes
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=checkboxes
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - JWT_EXPIRES_IN=15m
      - REFRESH_TOKEN_EXPIRES_IN=7d
      - TOTAL_CHECKBOXES=1000000
      - CHECKBOX_BITMAP_KEY=checkboxes:bitmap:v1
      - PUB_SUB_CHANNEL=checkboxes:batch:stream
      - USER_RATE_LIMIT_MS=200
      - BATCH_FLUSH_INTERVAL_MS=50
      - CORS_ORIGIN=https://mycheckboxes.com,http://localhost:5000
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - checkbox_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  valkey_data:

networks:
  checkbox_net:
    driver: bridge