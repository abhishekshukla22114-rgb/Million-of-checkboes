<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 Million Checkboxes</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, "Segoe UI", sans-serif;
            background: #090d18;
            color: #f4f6ff;
            -webkit-font-smoothing: antialiased;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 32px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background:
                radial-gradient(ellipse at 50% 0%, rgb(86 101 230 / 22%), transparent 55%),
                linear-gradient(145deg, #090d18, #11182a 55%, #0a1020);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 750;
            letter-spacing: -0.04em;
        }

        .stats-badge {
            font-size: 0.95rem;
            color: #a4b3d6;
            background: rgb(255 255 255 / 6%);
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid rgb(255 255 255 / 10%);
            display: inline-block;
        }

        #auth-panel {
            width: min(100%, 760px);
            margin: 0 0 16px;
            padding: 18px 20px;
            background: rgb(22 30 49 / 82%);
            border: 1px solid rgb(151 166 211 / 16%);
            border-radius: 16px;
        }

        #auth-heading {
            margin: 0 0 14px;
            font-size: 1.1rem;
        }

        #auth-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            align-items: end;
            gap: 12px;
        }

        #auth-form label {
            display: grid;
            gap: 6px;
            color: #a4b3d6;
            font-size: 0.85rem;
        }

        #auth-form input,
        .auth-button {
            min-height: 42px;
            padding: 9px 12px;
            color: #f4f6ff;
            background: #151e32;
            border: 1px solid #35425c;
            border-radius: 9px;
            font: inherit;
        }

        .auth-button {
            cursor: pointer;
            font-weight: 650;
            background: #5364e8;
            border-color: #7986ff;
        }

        .auth-button:hover {
            background: #6474f1;
        }

        .auth-button:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        #auth-toggle {
            margin-left: 8px;
            padding: 6px 0;
            color: #aab4ff;
            background: none;
            border: 0;
            cursor: pointer;
            font: inherit;
        }

        #auth-message {
            margin: 12px 0 0;
            color: #c3cbea;
            font-size: 0.9rem;
        }

        #auth-form[hidden],
        #auth-toggle[hidden],
        #auth-message[hidden],
        #username-field[hidden],
        #account-view[hidden] {
            display: none;
        }

        #account-view {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        #account-name {
            color: #c3cbea;
        }

        #server-alert {
            width: min(100%, 760px);
            margin: 0 0 16px;
            padding: 12px 16px;
            color: #ffd5d8;
            background: rgb(137 39 57 / 24%);
            border: 1px solid rgb(255 119 138 / 48%);
            border-radius: 12px;
            font-size: 0.9rem;
        }

        #server-alert[hidden] {
            display: none;
        }

        /* Virtual Scroller Viewport */
        #viewport {
            position: relative;
            width: min(100%, 760px);
            height: 680px;
            overflow-y: auto;
            background: rgb(22 30 49 / 82%);
            border: 1px solid rgb(151 166 211 / 16%);
            border-radius: 20px;
            box-shadow: 0 28px 80px rgb(0 0 0 / 40%);
            backdrop-filter: blur(14px);
        }

        /* Phantom spacer giving the scrollbar its full 1M height */
        #phantom-spacer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
        }

        /* Actual render grid holding only currently visible checkboxes */
        #render-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 12px;
            padding: 24px;
        }

        /* Checkbox Appearance */
        #render-grid input[type="checkbox"] {
            appearance: none;
            width: 100%;
            aspect-ratio: 1;
            margin: 0;
            background: #202a40;
            border: 1px solid #35425c;
            border-radius: 10px;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: background-color 140ms ease, border-color 140ms ease, transform 120ms ease;
        }

        #render-grid input[type="checkbox"]::before {
            content: "";
            width: 30%;
            height: 55%;
            border-right: 2.5px solid #fff;
            border-bottom: 2.5px solid #fff;
            opacity: 0;
            transform: translateY(-10%) rotate(45deg) scale(0.6);
            transition: opacity 120ms ease, transform 120ms ease;
        }

        #render-grid input[type="checkbox"]:hover {
            background: #293653;
            border-color: #8290ff;
            transform: scale(1.05);
        }

        #render-grid input[type="checkbox"]:checked {
            background: linear-gradient(145deg, #7986ff, #5364e8);
            border-color: #8d99ff;
            box-shadow: 0 4px 14px rgb(83 100 232 / 38%);
        }

        #render-grid input[type="checkbox"]:checked::before {
            opacity: 1;
            transform: translateY(-10%) rotate(45deg) scale(1);
        }
    </style>
</head>
<body>

    <header>
        <h1>1,000,000 Checkboxes</h1>
        <div class="stats-badge" id="stats">Connecting to cluster...</div>
    </header>

    <section id="auth-panel" aria-labelledby="auth-heading">
        <h2 id="auth-heading">Sign in to your account</h2>
        <form id="auth-form">
            <label id="username-field" hidden>
                Username
                <input id="auth-username" name="username" type="text" autocomplete="username" minlength="3" maxlength="30" pattern="[A-Za-z0-9]+" />
            </label>
            <label>
                Email
                <input id="auth-email" name="email" type="email" autocomplete="email" maxlength="255" required />
            </label>
            <label>
                Password
                <input id="auth-password" name="password" type="password" autocomplete="current-password" maxlength="128" required />
            </label>
            <button class="auth-button" id="auth-submit" type="submit">Sign in</button>
        </form>
        <button id="auth-toggle" type="button">Create an account</button>
        <p id="auth-message" role="status" aria-live="polite" hidden></p>
        <div id="account-view" hidden>
            <span id="account-name"></span>
            <button class="auth-button" id="auth-logout" type="button">Sign out</button>
        </div>
    </section>

    <div id="server-alert" role="alert" hidden></div>

    <div id="viewport">
        <div id="phantom-spacer"></div>
        <div id="render-grid"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const TOTAL_CHECKBOXES = 1_000_000;
        const COLUMNS = 10;
        const TOTAL_ROWS = TOTAL_CHECKBOXES / COLUMNS; // 100,000 rows
        const ROW_HEIGHT = 58; // Checkbox size + row gap in px
        const BUFFER_ROWS = 6;

        const viewport = document.getElementById('viewport');
        const spacer = document.getElementById('phantom-spacer');
        const grid = document.getElementById('render-grid');
        const statsEl = document.getElementById('stats');
        const serverAlert = document.getElementById('server-alert');
        const authForm = document.getElementById('auth-form');
        const authHeading = document.getElementById('auth-heading');
        const authSubmit = document.getElementById('auth-submit');
        const authToggle = document.getElementById('auth-toggle');
        const authMessage = document.getElementById('auth-message');
        const usernameField = document.getElementById('username-field');
        const usernameInput = document.getElementById('auth-username');
        const accountView = document.getElementById('account-view');
        const accountName = document.getElementById('account-name');
        let authMode = 'login';
        let accessToken = sessionStorage.getItem('accessToken');
        let refreshToken = sessionStorage.getItem('refreshToken');

        // Total scrollable virtual height = 100,000 rows * 58px = 5,800,000px
        spacer.style.height = `${TOTAL_ROWS * ROW_HEIGHT}px`;

        // 122KB binary state in RAM
        let bitfield = new Uint8Array(Math.ceil(TOTAL_CHECKBOXES / 8));
        let isReady = false;

        // Redis big-endian bitwise helpers
        function getBit(index) {
            const byteIndex = Math.floor(index / 8);
            const bitOffset = 7 - (index % 8);
            return ((bitfield[byteIndex] >> bitOffset) & 1) === 1;
        }

        function setBit(index, value) {
            const byteIndex = Math.floor(index / 8);
            const bitOffset = 7 - (index % 8);
            if (value) {
                bitfield[byteIndex] |= (1 << bitOffset);
            } else {
                bitfield[byteIndex] &= ~(1 << bitOffset);
            }
        }

        // --- Virtual Scroll Engine ---
        let currentStartRow = -1;
        let currentEndRow = -1;

        function renderVisible() {
            if (!isReady) return;

            const scrollTop = viewport.scrollTop;
            const viewportHeight = viewport.clientHeight;

            const startRow = Math.max(0, Math.floor(scrollTop / ROW_HEIGHT) - BUFFER_ROWS);
            const endRow = Math.min(TOTAL_ROWS, Math.ceil((scrollTop + viewportHeight) / ROW_HEIGHT) + BUFFER_ROWS);

            if (startRow === currentStartRow && endRow === currentEndRow) return;
            currentStartRow = startRow;
            currentEndRow = endRow;

            // Offset current slice to correct scroll position
            grid.style.transform = `translateY(${startRow * ROW_HEIGHT}px)`;

            const startIndex = startRow * COLUMNS;
            const endIndex = endRow * COLUMNS;

            const fragment = document.createDocumentFragment();
            for (let i = startIndex; i < endIndex; i++) {
                const box = document.createElement('input');
                box.type = 'checkbox';
                box.dataset.index = i;
                box.checked = getBit(i);
                fragment.appendChild(box);
            }

            grid.replaceChildren(fragment);
        }

        let scrollTick = false;
        viewport.addEventListener('scroll', () => {
            if (!scrollTick) {
                requestAnimationFrame(() => {
                    renderVisible();
                    scrollTick = false;
                });
                scrollTick = true;
            }
        }, { passive: true });

        // Event delegation: single click handler
        grid.addEventListener('change', (e) => {
            if (e.target.tagName !== 'INPUT') return;

            const index = Number(e.target.dataset.index);
            const checked = e.target.checked;

            setBit(index, checked);

            if (socket) {
                socket.emit('client:checkbox:change', { index, checked });
            }
        });

        // --- Socket.IO Sync ---
        const socket = typeof io === 'function'
            ? io({ auth: { token: accessToken } })
            : null;

        if (socket) {
            socket.on('server:error', (data) => {
                serverAlert.textContent = data.message || 'Action rejected by server.';
                serverAlert.hidden = false;
                setTimeout(() => { serverAlert.hidden = true; }, 3500);
            });

            socket.on('server:checkboxes:batch', (updates) => {
                for (let i = 0; i < updates.length; i++) {
                    const { index, checked } = updates[i];
                    setBit(index, checked);

                    const el = grid.querySelector(`input[data-index="${index}"]`);
                    if (el) {
                        el.checked = checked;
                    }
                }
            });
        }

        function showAuthMessage(message) {
            authMessage.textContent = message;
            authMessage.hidden = !message;
        }

        function updateAuthView(user) {
            const signedIn = Boolean(user);
            authForm.hidden = signedIn;
            authToggle.hidden = signedIn;
            accountView.hidden = !signedIn;
            authHeading.textContent = signedIn ? 'Your account' : authMode === 'login'
                ? 'Sign in to your account'
                : 'Create your account';
            if (signedIn) {
                accountName.textContent = `Signed in as ${user.username} (${user.email})`;
            }
        }

        function setAuthTokens(tokens) {
            accessToken = tokens.accessToken;
            refreshToken = tokens.refreshToken;
            sessionStorage.setItem('accessToken', accessToken);
            sessionStorage.setItem('refreshToken', refreshToken);
            if (socket) {
                socket.auth = { token: accessToken };
                socket.disconnect().connect();
            }
        }

        function clearAuthTokens() {
            accessToken = null;
            refreshToken = null;
            sessionStorage.removeItem('accessToken');
            sessionStorage.removeItem('refreshToken');
            if (socket) {
                socket.auth = {};
                socket.disconnect().connect();
            }
            updateAuthView(null);
        }

        async function authRequest(path, options = {}) {
            const response = await fetch(`/api/auth/${path}`, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    ...(options.headers || {}),
                },
            });
            let result;
            try {
                result = await response.json();
            } catch {
                throw new Error('The server returned an invalid response.');
            }
            if (!response.ok) {
                const error = new Error(result.error || 'Authentication request failed.');
                error.status = response.status;
                throw error;
            }
            return result;
        }

        function setAuthMode(mode) {
            authMode = mode;
            const registering = mode === 'register';
            usernameField.hidden = !registering;
            usernameInput.required = registering;
            document.getElementById('auth-password').autocomplete = registering
                ? 'new-password'
                : 'current-password';
            document.getElementById('auth-password').minLength = registering ? 8 : 0;
            authSubmit.textContent = registering ? 'Create account' : 'Sign in';
            authToggle.textContent = registering ? 'Already have an account? Sign in' : 'Create an account';
            updateAuthView(null);
            showAuthMessage('');
        }

        authToggle.addEventListener('click', () => {
            setAuthMode(authMode === 'login' ? 'register' : 'login');
        });

        authForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            showAuthMessage('');
            authSubmit.disabled = true;
            const formData = new FormData(authForm);
            const credentials = {
                email: formData.get('email'),
                password: formData.get('password'),
            };
            if (authMode === 'register') {
                credentials.username = formData.get('username');
            }

            try {
                const result = await authRequest(authMode, {
                    method: 'POST',
                    body: JSON.stringify(credentials),
                });
                setAuthTokens(result);
                updateAuthView(result.user);
            } catch (error) {
                showAuthMessage(error.message);
            } finally {
                authSubmit.disabled = false;
            }
        });

        document.getElementById('auth-logout').addEventListener('click', async () => {
            const tokenToRevoke = refreshToken;
            clearAuthTokens();
            try {
                if (tokenToRevoke) {
                    await authRequest('logout', {
                        method: 'POST',
                        body: JSON.stringify({ refreshToken: tokenToRevoke }),
                    });
                }
                showAuthMessage('You have signed out.');
            } catch (error) {
                showAuthMessage(`Signed out on this device, but the session could not be revoked: ${error.message}`);
            }
        });

        async function restoreSession() {
            if (!accessToken && !refreshToken) return;

            try {
                let result;
                try {
                    result = await authRequest('me', {
                        headers: { Authorization: `Bearer ${accessToken}` },
                    });
                } catch (error) {
                    if (error.status !== 401 || !refreshToken) throw error;
                    const refreshed = await authRequest('refresh', {
                        method: 'POST',
                        body: JSON.stringify({ refreshToken }),
                    });
                    setAuthTokens(refreshed);
                    result = await authRequest('me', {
                        headers: { Authorization: `Bearer ${accessToken}` },
                    });
                }
                updateAuthView(result.user);
            } catch (error) {
                if (error.status === 401) {
                    clearAuthTokens();
                    showAuthMessage('Your session expired. Please sign in again.');
                } else {
                    showAuthMessage(error.message);
                }
            }
        }

        // --- Fetch binary state on load ---
        async function init() {
            try {
                const res = await fetch('/checkboxes/binary');
                const buffer = await res.arrayBuffer();
                bitfield = new Uint8Array(buffer);
                isReady = true;

                statsEl.textContent = 'Live • 1,000,000 Checkboxes';
                renderVisible();
            } catch (err) {
                console.error('Binary payload failed to load:', err);
                statsEl.textContent = 'Failed to load binary state';
            }
        }

        window.addEventListener('load', () => {
            init();
            restoreSession();
        });
    </script>
</body>
</html>
